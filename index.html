    <!-- Background slideshow for the static landing page -->
    <script>
    (function () {
        var container = document.getElementById('bgSlideshow');
        if (!container) return;
        var base = location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
        var images = [];
        images.push(base + 'assets/images/glassmorphism-background.jpg');
        var slides = [];
        var current = 0;
        var interval = 5000;
        var timer = null;
        var loadedCount = 0;

        function createSlide(src, idx) {
            var div = document.createElement('div');
            div.className = 'slide' + (idx === 0 ? ' active' : '');
            div.style.backgroundImage = 'url(' + src + ')';
            container.appendChild(div);
            slides.push(div);
            loadedCount++;
        }

        function startAutoplay() {
            stopAutoplay();
            timer = setInterval(next, interval);
        }

        function stopAutoplay() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }

        function next() {
            if (slides.length < 2) return;
            slides[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
        }

        function prev() {
            if (slides.length < 2) return;
            slides[current].classList.remove('active');
            current = (current - 1 + slides.length) % slides.length;
            slides[current].classList.add('active');
        }

        // Lazy-load images in chunks to reduce mobile startup cost.
        // Priority: first image immediately, then the rest in small batches.
        function loadBatch(start, count) {
            var end = Math.min(start + count, images.length);
            for (var i = start; i < end; i++) {
                createSlide(images[i], i);
            }
            if (end < images.length) {
                setTimeout(function () { loadBatch(end, count); }, 150);
            } else {
                startAutoplay();
            }
        }

        // Touch swipe support
        var touchStartX = 0;
        var touchEndX = 0;
        var swipeThreshold = 50;

        container.addEventListener('touchstart', function (e) {
            touchStartX = e.changedTouches[0].screenX;
            stopAutoplay();
        }, { passive: true });

        container.addEventListener('touchend', function (e) {
            touchEndX = e.changedTouches[0].screenX;
            var diff = touchStartX - touchEndX;
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    next();
                } else {
                    prev();
                }
            }
            startAutoplay();
        }, { passive: true });

        // Start: load first image now, then the rest in batches
        loadBatch(0, 1);
    })();
    </script>
