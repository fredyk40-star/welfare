</head>
<body>

    <div class="bg-slideshow" id="bgSlideshow"></div>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">
                
                <div class="card glass-strong">
                    <div class="card-body text-center">
                        <img src="https://welfare-gold-one.vercel.app/assets/images/logo.png" alt="GYF Welfare" class="app-logo-large mb-3">
                        <h3>Member Login</h3>
                    </div>
                    <div class="card-body">
                                                
                                                
                                                
                        <form method="POST" action="" id="loginForm">
                            <input type="hidden" name="csrf_token" value="f2517ee1683b6272a36c29a4771f7a88c561cd7073505b709af5d6cb14403f25">
                            <div class="mb-3">
                                <label for="member_id" class="form-label">Member ID</label>
                                <input type="text" class="form-control" id="member_id" name="member_id" 
                                       placeholder="Enter your Member ID (e.g., GYF-546578)" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" 
                                           placeholder="Enter your password" required>
                                    <button class="btn btn-outline-secondary" type="button" data-toggle-password="password" data-toggle-icon="toggleIcon">
                                        <span id="toggleIcon">👁️</span>

                            <button type="submit" class="btn btn-primary w-100" id="loginButton">

                    <a href="https://welfare-gold-one.vercel.app/" class="btn btn-outline-light btn-sm back-link">
                        ← Back
                    </a>
                </div>
                        </div>
                    </div>

            </div>

    <script src="https://welfare-gold-one.vercel.app/assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://welfare-gold-one.vercel.app/assets/js/main.js"></script>
    <script src="https://welfare-gold-one.vercel.app/assets/js/validation.js"></script>
    <script nonce="r/u8bfQcEpi8Ia4a1qRO3g==">
    function togglePassword(fieldId, iconId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById(iconId);
        if (!field || !icon) return;
        if (field.type === 'password') {
            field.type = 'text';
            icon.textContent = '🙈';
        } else {
            field.type = 'password';
            icon.textContent = '👁️';
        }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const loginButton = document.getElementById('loginButton');
        const loginText = document.getElementById('loginText');
        const loginSpinner = document.getElementById('loginSpinner');
        
        if (!navigator.onLine) {
            e.preventDefault();
            alert('Internet connection required. Please check your connection and try again.');
            return false;
        }
        
        loginButton.disabled = true;
        loginText.classList.add('d-none');
        loginSpinner.classList.remove('d-none');
        
        const memberId = document.getElementById('member_id').value.trim();
        const password = document.getElementById('password').value;
        
        if (!memberId || !password) {
            e.preventDefault();
            loginButton.disabled = false;
            loginText.classList.remove('d-none');
            loginSpinner.classList.add('d-none');
            return false;
        }
        
        return true;
    });

    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('member_id').focus();
        
        document.querySelectorAll('[data-toggle-password]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var fieldId = this.dataset.togglePassword;
                var iconId = this.dataset.toggleIcon;
                var field = document.getElementById(fieldId);
                var icon = document.getElementById(iconId);
                if (!field || !icon) return;
                var type = field.getAttribute('type') === 'password' ? 'text' : 'password';
                field.setAttribute('type', type);
            });
        });
    });

    if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.href);
    }

    window.addEventListener('pageshow', function() {
        document.getElementById('loginForm').reset();
    });
    </script>

    <script src="https://welfare-gold-one.vercel.app/assets/js/slideshow.js"></script>
</body>
